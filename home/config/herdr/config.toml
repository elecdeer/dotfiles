onboarding = false

[terminal]
shell = "$SHELL"

[keys]
prefix = "ctrl+b"
help = "prefix+?"
settings = "prefix+s"
detach = "prefix+q"
reload_config = "prefix+shift+r"

# Workspace controls
workspace_picker = "prefix+w"
goto = "prefix+g"
new_workspace = ""
new_worktree = "prefix+shift+g"
rename_workspace = "prefix+shift+w"
close_workspace = "prefix+shift+d"
previous_workspace = "cmd+alt+left"
next_workspace = "cmd+alt+right"
switch_workspace = "cmd+shift+1..9"

# Tab controls, matching the old Zellij Cmd-key workflow.
new_tab = "cmd+t"
rename_tab = "prefix+shift+t"
previous_tab = "cmd+shift+["
next_tab = "cmd+shift+]"
switch_tab = "cmd+1..9"
close_tab = "cmd+shift+w"

# Pane controls
cycle_pane_previous = "cmd+["
cycle_pane_next = "cmd+]"
split_vertical = "cmd+d"
split_horizontal = "cmd+shift+d"
close_pane = "cmd+w"
rename_pane = "prefix+shift+p"
edit_scrollback = "prefix+e"
zoom = "prefix+z"
resize_mode = "prefix+r"
toggle_sidebar = "prefix+b"

[[keys.command]]
key = "prefix+shift+n"
type = "shell"
command = "herdr-workspace-new-2pane"
description = "new 2-pane workspace"

[[keys.command]]
key = "ctrl+alt+q"
type = "pane"
command = "fzf-ghq-herdr-workspace"
description = "open repository workspace"

[[keys.command]]
key = "ctrl+q"
type = "pane"
command = "gwt-herdr-workspace"
description = "open worktree workspace"

[theme]
# iceberg-dark カラースキーム
bg = "#1e2132"
fg = "#c6c8d1"
accent = "#84a0c6"
green = "#b4c087"
red = "#e27878"
yellow = "#e2a478"
blue = "#84a0c6"
cyan = "#89b8c2"
magenta = "#a093c7"

[theme.custom]
surface_dim = "#6a7490"

[ui]
sidebar_width = 30

[session]
restore = true
