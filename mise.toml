# dotfiles 管理用 mise 設定
# ----------------------------
# このファイルはリポジトリ内でのみ使用され、home 側へは配置されない。
# `mise dotfiles apply` / `mise bootstrap packages apply` をリポジトリ直下で実行する。
# CLI ツールの一覧は home/config/mise/config.toml（= ~/.config/mise/config.toml）側にある。

[vars]
# dotfiles テンプレートから参照するリポジトリのルート。
# テンプレート描画コンテキストでは config_root を直接参照できないため vars 経由で渡す。
repo_root = "{{ config_root }}"

[settings]
# dotfiles のソースルート。config_root = この mise.toml があるディレクトリ（＝リポジトリ）。
dotfiles.root = "{{ config_root }}"
dotfiles.default_mode = "symlink"

[dotfiles]
"~/.zshrc" = "home/zshrc"
"~/.zprofile" = "home/zprofile"
"~/.zshenv" = "home/zshenv"
"~/.default-npm-packages" = "home/default-npm-packages"

# ディレクトリはソース構造だけをミラーして各ファイルを個別 symlink する
# （symlink-each）。~/.config などに他ツールが生成したファイルを壊さない。
"~/.config" = { source = "home/config", mode = "symlink-each" }
"~/.claude" = { source = "home/claude", mode = "symlink-each" }
"~/.apm" = { source = "home/apm", mode = "symlink-each" }
"~/.docker" = { source = "home/docker", mode = "symlink-each" }
"~/.local/bin" = { source = "home/local/bin", mode = "symlink-each" }

# テンプレート要（repo_root 参照 + OS 分岐）。symlink-each 対象の
# home/config 配下には置かず templates/ から直接生成する。
"~/.config/sheldon/plugins.toml" = { source = "templates/sheldon-plugins.toml.tera", mode = "template" }

[bootstrap.packages]
# 現状 system package の依存は無い（CLI ツールは home/config/mise/config.toml の [tools] で管理）。
# 将来 system ライブラリが必要になったら "brew:xxx" / "apt:xxx" 形式でここに追加し、
# `mise bootstrap packages apply` で導入する。

[tasks.setup-agents-skills]
description = "~/.agents/skills -> ~/.claude/skills の symlink を作成する"
# mise dotfiles は非リポジトリの home パスを指す相対 symlink を扱えないため task で再現する。
run = "mkdir -p ~/.agents && ln -sfn ../.claude/skills ~/.agents/skills"

[tasks.skills-install]
description = "apm.yml の依存関係を解決し ~/.claude/skills へ直接デプロイする"
# apm install --global はデプロイ先 (.claude/skills) を実行時のカレントディレクトリ基準で
# 解決するため、リポジトリ直下で実行すると誤ってリポジトリ内に生成されてしまう。
# dir = "~" で作業ディレクトリを固定し ~/.claude/skills を対象にする。
dir = "~"
run = "apm install --global --target claude"

[tasks.skills-update]
description = "apm.yml の #main 参照先を最新化し ~/.claude/skills へ再デプロイする"
dir = "~"
run = "apm update --global --target claude"

[tasks.bootstrap-git-signing-key]
description = "Secure Enclave に Git 署名用 SSH 鍵(git-sign)を作成し ~/.ssh/id_git_sign へエクスポートする（冪等）"
# ssh-keygen -K は Secure Enclave 上の全 resident key をダウンロードしようとするため、
# git-sign 以外の CTK identity が存在すると 2 件目以降で overwrite 確認の対話プロンプトが
# 出て非対話実行が止まる。上書き確認を抑止するオプションは ssh-keygen 側に存在しない。
run = '''
set -eu

label=git-sign
key_path="$HOME/.ssh/id_git_sign"

if [ -f "$key_path" ]; then
  echo "already exported: $key_path"
  exit 0
fi

if ! sc_auth list-ctk-identities | tail -n +2 | awk '{print $4}' | grep -qx "$label"; then
  sc_auth create-ctk-identity -l "$label" -k p-256-ne -t none
fi

tmp_dir=$(mktemp -d)
trap 'rm -rf "$tmp_dir"' EXIT
(cd "$tmp_dir" && ssh-keygen -w /usr/lib/ssh-keychain.dylib -K -N "")

mv "$tmp_dir/id_ecdsa_sk_rk" "$key_path"
mv "$tmp_dir/id_ecdsa_sk_rk.pub" "$key_path.pub"
echo "exported: $key_path"
'''
