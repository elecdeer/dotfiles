# dotfiles 管理用 mise 設定
# ----------------------------
# このファイルはリポジトリ内でのみ使用され、home 側へは配置されない。
# `mise dotfiles apply` / `mise bootstrap packages apply` をリポジトリ直下で実行する。
# CLI ツールの一覧は home/config/mise/config.toml（= ~/.config/mise/config.toml）側にある。

[vars]
# dotfiles テンプレートから参照するリポジトリのルート。
# テンプレート描画コンテキストでは config_root を直接参照できないため vars 経由で渡す。
repo_root = "{{ config_root }}"

[settings]
# dotfiles のソースルート。config_root = この mise.toml があるディレクトリ（＝リポジトリ）。
dotfiles.root = "{{ config_root }}"
dotfiles.default_mode = "symlink"

[dotfiles]
"~/.zshrc" = "home/zshrc"
"~/.zprofile" = "home/zprofile"
"~/.zshenv" = "home/zshenv"
"~/.default-npm-packages" = "home/default-npm-packages"

# ディレクトリはソース構造だけをミラーして各ファイルを個別 symlink する
# （symlink-each）。~/.config などに他ツールが生成したファイルを壊さない。
"~/.config" = { source = "home/config", mode = "symlink-each" }
"~/.claude" = { source = "home/claude", mode = "symlink-each" }
"~/.apm" = { source = "home/apm", mode = "symlink-each" }
"~/.docker" = { source = "home/docker", mode = "symlink-each" }
"~/.local/bin" = { source = "home/local/bin", mode = "symlink-each" }

# テンプレート要（repo_root 参照 + OS 分岐）。symlink-each 対象の
# home/config 配下には置かず templates/ から直接生成する。
"~/.config/sheldon/plugins.toml" = { source = "templates/sheldon-plugins.toml.tera", mode = "template" }

[bootstrap.packages]
# 現状 system package の依存は無い（CLI ツールは home/config/mise/config.toml の [tools] で管理）。
# 将来 system ライブラリが必要になったら "brew:xxx" / "apt:xxx" 形式でここに追加し、
# `mise bootstrap packages apply` で導入する。

# macOS 標準のウインドウ配置（画面全体・中央・前のサイズに戻す・左右半分）を ⌃⌥⌘ 系のショートカットにする。
# 既定は ⌃fn 併用で、fn を修飾キーとして送らない外付けキーボードでは使えない。
# ⌃⌥ だと VS Code 等の既定ショートカットと衝突するため ⌘ も足す。実際の操作は Karabiner で「英数ホールド + キー」から送る（home/karabiner）。
# 設定アプリ「キーボードショートカット > ウインドウ」と同じ com.apple.symbolichotkeys に書く。
# NSUserKeyEquivalents（アプリのショートカット）でメニュー項目を上書きする方法は、このシステムショートカットが優先されるため効かなかった。
# ID と既定値は /System/Library/ExtensionKit/Extensions/KeyboardSettings.appex/Contents/Resources/en.lproj/DefaultShortcutsTable.xml を参照。
# parameters = [文字コード(なしは 65535), 仮想キーコード, 修飾フラグ]。修飾フラグは ⌃=0x40000, ⌥=0x80000, ⌘=0x100000,
# 矢印キーは設定アプリが付けるのと同じく fn(0x800000) を含める。
# path で ID 単位に書くのは、AppleSymbolicHotKeys 全体を置き換えると他のショートカット設定が消えるため。
# 反映にはログアウトするか activateSettings -u を実行する。
[[bootstrap.macos.defaults_entries]] # ⌃⌥⌘F 画面全体に表示
domain = "com.apple.symbolichotkeys"
key = "AppleSymbolicHotKeys"
path = ["237"]
value = { enabled = true, value = { type = "standard", parameters = [102, 3, 1835008] } }

[[bootstrap.macos.defaults_entries]] # ⌃⌥⌘C 中央に配置
domain = "com.apple.symbolichotkeys"
key = "AppleSymbolicHotKeys"
path = ["238"]
value = { enabled = true, value = { type = "standard", parameters = [99, 8, 1835008] } }

[[bootstrap.macos.defaults_entries]] # ⌃⌥⌘R 前のサイズに戻す
domain = "com.apple.symbolichotkeys"
key = "AppleSymbolicHotKeys"
path = ["239"]
value = { enabled = true, value = { type = "standard", parameters = [114, 15, 1835008] } }

[[bootstrap.macos.defaults_entries]] # ⌃⌥⌘← 左半分
domain = "com.apple.symbolichotkeys"
key = "AppleSymbolicHotKeys"
path = ["240"]
value = { enabled = true, value = { type = "standard", parameters = [65535, 123, 10223616] } }

[[bootstrap.macos.defaults_entries]] # ⌃⌥⌘→ 右半分
domain = "com.apple.symbolichotkeys"
key = "AppleSymbolicHotKeys"
path = ["241"]
value = { enabled = true, value = { type = "standard", parameters = [65535, 124, 10223616] } }

# 別ディスプレイへの移動はシステムショートカット（symbolichotkeys）に無いため、
# 「ウインドウ > 移動とサイズ変更 > <ディスプレイ名>に移動」メニューにアプリのショートカットとして割り当てる。
# 方向指定の項目は無いので、配置（JAPANNEXT MNT が内蔵ディスプレイの上）に合わせて ↑ / ↓ を割り当てる。
# タイトルにディスプレイ名（NSScreen.localizedName）が入るため、接続するディスプレイが変わったら追記が必要。
# 上下半分（ID 242/243）は既定の ⌃fn↑↓ に明示的に戻す（同じキーだとそちらが優先されメニューに届かない）。
# エントリを消すだけでは WindowManager が以前の割り当てを保持し続けたため、既定値を書いて上書きする。
[[bootstrap.macos.defaults_entries]] # ⌃fn↑ 上半分（既定）
domain = "com.apple.symbolichotkeys"
key = "AppleSymbolicHotKeys"
path = ["242"]
value = { enabled = true, value = { type = "standard", parameters = [65535, 126, 8650752] } }

[[bootstrap.macos.defaults_entries]] # ⌃fn↓ 下半分（既定）
domain = "com.apple.symbolichotkeys"
key = "AppleSymbolicHotKeys"
path = ["243"]
value = { enabled = true, value = { type = "standard", parameters = [65535, 125, 8650752] } }

[[bootstrap.macos.defaults_entries]] # ⌃⌥⌘↓ 下の内蔵ディスプレイへ移動
domain = "NSGlobalDomain"
key = "NSUserKeyEquivalents"
path = ["内蔵Retinaディスプレイに移動"]
value = "^~@\uF701"

[[bootstrap.macos.defaults_entries]] # ⌃⌥⌘↑ 上の外部ディスプレイへ移動
domain = "NSGlobalDomain"
key = "NSUserKeyEquivalents"
path = ["JAPANNEXT MNTに移動"]
value = "^~@\uF700"

[tasks.setup-agents-skills]
description = "~/.agents/skills -> ~/.claude/skills の symlink を作成する"
# mise dotfiles は非リポジトリの home パスを指す相対 symlink を扱えないため task で再現する。
run = "mkdir -p ~/.agents && ln -sfn ../.claude/skills ~/.agents/skills"

[tasks.git-install-template-hooks]
description = "gdn 管理下の既存リポジトリへ init.templateDir の hooks を配置する（既存ファイルは上書きしない）"
run = '''
set -eu
gdn repo list --column path --no-color | while IFS= read -r repo; do
  git -C "$repo" init --quiet
  echo "applied: $repo"
done
'''

[tasks.skills-install]
description = "apm.yml の依存関係を解決し ~/.claude/skills へ直接デプロイする"
# apm install --global はデプロイ先 (.claude/skills) を実行時のカレントディレクトリ基準で
# 解決するため、リポジトリ直下で実行すると誤ってリポジトリ内に生成されてしまう。
# dir = "~" で作業ディレクトリを固定し ~/.claude/skills を対象にする。
dir = "~"
run = "apm install --global --target claude"

[tasks.skills-update]
description = "apm.yml の #main 参照先を最新化し ~/.claude/skills へ再デプロイする"
dir = "~"
run = "apm update --global --target claude"

[tasks.bootstrap-git-signing-key]
description = "Secure Enclave に Git 署名用 SSH 鍵(git-sign)を作成し ~/.ssh/id_git_sign へエクスポートする（冪等）"
# ssh-keygen -K は Secure Enclave 上の全 resident key をダウンロードしようとするため、
# git-sign 以外の CTK identity が存在すると 2 件目以降で overwrite 確認の対話プロンプトが
# 出て非対話実行が止まる。上書き確認を抑止するオプションは ssh-keygen 側に存在しない。
run = '''
set -eu

label=git-sign
key_path="$HOME/.ssh/id_git_sign"

if [ -f "$key_path" ]; then
  echo "already exported: $key_path"
  exit 0
fi

if ! sc_auth list-ctk-identities | tail -n +2 | awk '{print $4}' | grep -qx "$label"; then
  sc_auth create-ctk-identity -l "$label" -k p-256-ne -t none
fi

tmp_dir=$(mktemp -d)
trap 'rm -rf "$tmp_dir"' EXIT
(cd "$tmp_dir" && ssh-keygen -w /usr/lib/ssh-keychain.dylib -K -N "")

mv "$tmp_dir/id_ecdsa_sk_rk" "$key_path"
mv "$tmp_dir/id_ecdsa_sk_rk.pub" "$key_path.pub"
echo "exported: $key_path"
'''
